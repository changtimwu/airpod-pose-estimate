[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airpod-pose"
version = "0.1.0"
description = "Head-pose estimation from AirPods motion sensors (hackathon skeleton)"
# No `readme`: the real one lives at the repo root, and setuptools refuses to
# read a file outside the project directory.
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[project.scripts]
airpod-pose = "airpod_pose.cli:main"

[tool.setuptools]
packages = ["airpod_pose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
