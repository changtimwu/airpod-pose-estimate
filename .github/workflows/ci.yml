name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # The Python side is hardware-free by design: --source synthetic covers it.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "python[dev]"
      - run: cd python && pytest -q

  swift:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cd swift-capture && swift build
